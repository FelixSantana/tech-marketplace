name: Repair catalog index

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore index from known-good commit
        run: |
          git checkout 6768fd41b34801d7f82ed4748eaa399d01ab14a6 -- index.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = ".field input[type=text],\n  .field input[type=number],"
          new = ".field input[type=text],\n  .field input[type=email],\n  .field input[type=number],"
          if old not in s:
              raise SystemExit('Expected CSS selector was not found')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit repaired index and remove repair workflow
        run: |
          rm -f .github/workflows/repair-index.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/repair-index.yml
          if git diff --cached --quiet; then
            echo "Nothing to repair"
            exit 0
          fi
          git commit -m "fix: restore catalog and style admin email field"
          git push
