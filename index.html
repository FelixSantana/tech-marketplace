<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>__NOMBRE__ — Catálogo</title>
    <meta name="description" content="Mira el catálogo de __NOMBRE__ y haz tu pedido por WhatsApp." />
    <meta name="theme-color" content="#0a0c12" />
    <link rel="icon" type="image/png" sizes="180x180" href="/icon-180.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link rel="canonical" href="__ORIGEN__/" />
    <!-- Instalable en el telefono. El manifiesto no es un archivo: lo arma api/manifiesto con el
         nombre y los iconos que el dueño tiene en Ajustes, asi que cambiarlos ahi basta. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="mobile-web-app-capable" content="yes" />
    <!-- La de Apple quedo obsoleta pero se conserva: iOS viejo solo entiende esa. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="__NOMBRE__" />

    <!-- Vista previa al compartir el enlace (WhatsApp, Facebook, Instagram, X).
         WhatsApp no ejecuta JavaScript: estas etiquetas tienen que venir en el HTML inicial,
         y las URLs tienen que ser absolutas.
         __ORIGEN__ lo sustituye el build por el dominio del despliegue (scripts/dominio.mjs), que
         es lo que permite que varias tiendas compilen del mismo repositorio sin que una anuncie
         el dominio de otra. Si el dominio no se puede averiguar, el build borra estas lineas.
         /og.jpg NO es un archivo: lo sirve api/og, que devuelve la imagen derivada del logo del
         dueño si subio uno, y si no la de public/og-image.jpg. Por eso la etiqueta puede ser fija
         aunque la imagen cambie.
         __NOMBRE__ lo pone el build desde la variable TIENDA_NOMBRE del proyecto en Vercel. No
         puede salir de Ajustes: esto se resuelve al compilar y Ajustes vive en la base de datos,
         que solo se lee al ejecutar. Sin esa variable sale el marcador de posicion. Al compartir
         un PRODUCTO no hace falta: /p/<slug> lo sirve una funcion que reescribe estas etiquetas
         con el nombre real de la tienda. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="__NOMBRE__" />
    <meta property="og:locale" content="es_DO" />
    <meta property="og:url" content="__ORIGEN__/" />
    <meta property="og:title" content="__NOMBRE__ — Catálogo" />
    <meta property="og:description" content="Mira el catálogo de __NOMBRE__ y haz tu pedido por WhatsApp." />
    <meta property="og:image" content="__ORIGEN__/og.jpg" />
    <meta property="og:image:secure_url" content="__ORIGEN__/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <!-- Generico a proposito: la imagen ya no es siempre la de Synaptic, es el logo de quien tenga
         la tienda, y un texto alternativo que nombre a otro negocio seria sencillamente falso. -->
    <meta property="og:image:alt" content="Logo de la tienda" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="__NOMBRE__ — Catálogo" />
    <meta name="twitter:description" content="Mira el catálogo de __NOMBRE__ y haz tu pedido por WhatsApp." />
    <meta name="twitter:image" content="__ORIGEN__/og.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
